[package]
name = "quicknote"
version = "0.1.0"
description = "QuickNote local-first markdown notes and quick capture"
authors = ["QuickNote"]
edition = "2021"
default-run = "quicknote"

[lib]
name = "quicknote_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
notify = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
specta-serde = "0.0.15"
specta-typescript = "0.0.15"
tauri = { version = "2", features = [] }
thiserror = "2"
