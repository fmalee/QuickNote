[package]
name = "quicknote"
version = "2.0.0"
description = "QuickNote local-first markdown notes and quick capture"
authors = ["QuickNote"]
edition = "2021"
default-run = "quicknote"

[lib]
name = "quicknote_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
chrono = "0.4"
libc = "0.2"
notify = "6"
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
specta-serde = "0.0.15"
specta-typescript = "0.0.15"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
thiserror = "2"
trash = "5"
